<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Low Poly Drift - Free Low Poly Drifting Game</title>
<meta name="description" content="Low Poly Drift is a free low poly drifting game. Race online with friends, earn coins, unlock new cars and climb the ranks.">
<meta name="robots" content="index, follow">
<meta property="og:type" content="website">
<meta property="og:title" content="Low Poly Drift - Free Low Poly Drifting Game">
<meta property="og:description" content="Race online with friends, earn coins, unlock new cars and climb the ranks.">
<meta property="og:image" content="logo.png">
<!-- INCOLLA QUI il tag google-site-verification di Search Console -->
<link rel="canonical" href="https://low-poly-drift.vercel.app/">
<meta property="og:url" content="https://low-poly-drift.vercel.app/">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a1216">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Low Poly Drift">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="ui.css">
<style>
body{justify-content:center}
.sub{font-size:15px}
.logo{display:block;width:min(520px,86vw);height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
</style>
</head>
<body>
<iframe id="bgmap" data-src="game.html?bg=1" tabindex="-1" aria-hidden="true"></iframe><div id="bgdim"></div>
<h1><img class="logo" src="logo.png" alt="Low Poly Drift"></h1>
<div class="panel coins" id="coins"></div>
<div id="rankbar"></div>
<div class="menu">
  <button class="btn big" id="play">Play</button>
  <button class="btn big" id="shop">Shop</button>
  <button class="btn big" id="settings">Settings</button>
  <button class="btn big" id="advent" style="display:none;background:#c8102e;color:#fff">Advent Calendar</button>
  <button class="btn ghost" id="acc"></button>
  <button class="btn ghost" id="dl" style="display:none">Download the app</button>
</div>
<script src="config.js"></script>
<script src="device.js"></script>
<script src="cars.js"></script>
<script src="cloud.js"></script>
<script>
document.getElementById('coins').innerHTML=coinImg+'<b>'+prog.coins+'</b><span>coins</span><span style="color:var(--muted)">&middot; '+RANKS[prog.car].v+'</span>';
document.getElementById('rankbar').innerHTML=rankBarHTML(prog.elo);
// Christmas event: Advent button visible 1 Dec - 3 Jan (Italy time), or with ?betatest=christmas
if(XMAS_ON()){const a=document.getElementById('advent');a.style.display='';a.onclick=()=>go('advent.html')}
if(BETA){const t=document.createElement('div');t.textContent='BETA TEST: '+BETA;t.style.cssText='position:fixed;top:8px;left:8px;background:#c8102e;color:#fff;font:700 12px sans-serif;padding:4px 10px;border-radius:8px;z-index:9';t.onclick=()=>{location.href='index.html?betatest=off'};document.body.appendChild(t)}
const ac=document.getElementById('acc');ac.textContent=CLOUD.user()?'Cloud save: '+CLOUD.user():'Sign in / Cloud save';ac.onclick=()=>go('save.html');CLOUD.sync();
document.getElementById('play').onclick=()=>go('lobby.html');
document.getElementById('shop').onclick=()=>go('shop.html');
document.getElementById('settings').onclick=()=>go('settings.html');
if(!window.IN_APP){const d=document.getElementById('dl');d.style.display='';d.onclick=()=>go('download.html')}  // website only
</script>
</body>
</html>
