<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Artic ID and cloud save - Low Poly Drift</title>
<meta name="description" content="Sign in with your Artic ID to keep your Low Poly Drift progress in the cloud.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a1216">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="ui.css">
<style>
body{justify-content:flex-start}.wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px}
.ch{display:flex;flex-direction:column;gap:8px}.ch b{font-size:18px}.ch small{color:var(--muted)}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7dff9b,#ffd84a)}
.ok{color:#7dff9b}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
textarea{font:13px monospace;width:100%;height:96px;border-radius:12px;border:0;padding:10px;background:rgba(0,0,0,.35);color:var(--ink)}
.btn.sm{padding:10px 16px;font-size:15px}.acts{display:flex;gap:8px;flex-wrap:wrap}#msg{color:var(--muted);min-height:20px}
</style>
</head>
<body>
<iframe id="bgmap" data-src="game.html?bg=1" tabindex="-1" aria-hidden="true"></iframe><div id="bgdim"></div>
<div class="top"><button class="btn ghost" id="back">&larr; Menu</button><h2>Artic ID</h2><span></span></div>
<div class="wrap" id="w"></div>
<script src="config.js?v=3"></script>
<script src="device.js"></script>
<script src="cars.js"></script>
<script src="cloud.js"></script>
<script>
const $=id=>document.getElementById(id);$('back').onclick=()=>go('index.html');
const say=t=>$('msg').textContent=t||'';
const esc=t=>String(t).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
function draw(){const u=CLOUD.user();let h='';
 if(u){h='<div class="panel ch"><b>Signed in as '+esc(u)+'</b><small>Your Artic ID: '+esc(CLOUD.aid()||'-')+'<br>Your progress saves to the cloud automatically after every race and purchase, and loads on any device where you sign in.</small><div class="acts"><button class="btn sm" id="now">Sync now</button><button class="btn ghost sm" id="chg">Change password</button><button class="btn ghost sm" id="out">Sign out</button></div></div>'}
 else{h='<div class="panel ch"><b>Artic ID</b><small>One account for all Artic Studio games. Your cars, wraps, coins and rank follow you to every phone, browser and app. You will go to the Artic ID site to sign in, then come right back here.</small><div class="acts"><button class="btn sm" id="in">Sign in</button><button class="btn ghost sm" id="up">Create Artic ID</button></div><div class="acts"><button class="btn ghost sm" id="fg">Forgot password?</button></div></div>'}
 $('w').innerHTML=h+'<div id="msg"></div>';
 if(u){$('now').onclick=async()=>{say('Syncing...');const r=await CLOUD.sync();if(r&&r.status===401){say('Session expired, sign in again');draw()}else say(r&&r.ok?'Synced!':(r&&r.err)||'Done')};
  $('chg').onclick=()=>CLOUD.start('password');
  $('out').onclick=async()=>{await CLOUD.logout();draw()};return}
 $('in').onclick=()=>CLOUD.start('in');$('up').onclick=()=>CLOUD.start('up');$('fg').onclick=()=>CLOUD.start('forgot')}
(async()=>{draw();const r=await CLOUD.finish();
 if(r){if(r.ok){draw();say('Signed in!');await CLOUD.sync();draw();say('Signed in!')}else say(r.err)}})();
</script>
</body>
</html>
