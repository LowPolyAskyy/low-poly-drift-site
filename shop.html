<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Garage - Low Poly Drift</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a1216">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Low Poly Drift">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="ui.css">
<style>
body{justify-content:flex-start}
.garage{width:100%;max-width:1100px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,1fr);gap:14px;align-items:start}
.stage{padding:0;overflow:hidden;display:flex;flex-direction:column}
.viewer{position:relative;height:clamp(240px,50vh,470px);background:radial-gradient(ellipse at 50% 78%,rgba(255,196,120,.38),rgba(255,196,120,0) 62%),linear-gradient(rgba(59,42,69,.55),rgba(26,19,30,.72));cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.viewer:active{cursor:grabbing}
.viewer canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.viewer.nogl::after{content:"3D preview not available on this device";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px;text-align:center;padding:20px}
.viewer.bought{animation:flash .7s ease-out}
@keyframes flash{0%{box-shadow:inset 0 0 0 0 rgba(255,216,74,0)}25%{box-shadow:inset 0 0 90px 10px rgba(255,216,74,.55)}100%{box-shadow:inset 0 0 0 0 rgba(255,216,74,0)}}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:64px;border-radius:14px;background:rgba(18,14,18,.55);color:var(--ink);font-size:30px;line-height:1;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.nav:hover{background:rgba(18,14,18,.8)}
.nav.prev{left:10px}.nav.next{right:10px}
.tags{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:rgba(18,14,18,.6);color:var(--ink)}
.chip.ok{background:#7dff9b;color:#10210f}.chip.lock{background:#ffb36b;color:#2a1405}.chip.eq{background:var(--accent);color:#1a1210}
.hint{position:absolute;right:12px;bottom:10px;font-size:12px;color:var(--muted);pointer-events:none}
.info{padding:4px 20px 20px;display:flex;flex-direction:column;gap:14px}
.info h3{margin:0;font-size:30px;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center}
.stats .l{color:var(--muted);font-size:14px}
.stats .v{font-weight:700;min-width:30px;text-align:right}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#ff8a4c,#ffd84a);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.buy{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.price{display:flex;align-items:center;gap:6px;color:var(--gold);font-weight:700;font-size:26px}
.price img{width:30px;height:30px}
.buy .btn{flex:1;min-width:170px;border-radius:14px;padding:16px 22px;font-size:20px}
.buy .btn.ok{background:#7dff9b}
.list{padding:10px;max-height:min(78vh,660px);overflow-y:auto}
.tabs{display:flex;gap:6px;margin-bottom:10px;position:sticky;top:-10px;padding:2px 0 8px;z-index:1}
.tab{flex:1;padding:9px 6px;border-radius:10px;background:rgba(0,0,0,.28);color:var(--muted);font-weight:700;font-size:14px}
.tab.on{background:var(--accent);color:#1a1210}
#rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.25);color:var(--ink);border:2px solid transparent}
.row:hover{background:rgba(0,0,0,.4)}
.row.on{border-color:var(--accent);background:rgba(255,138,76,.14)}
.row .sw{flex:0 0 34px;height:34px;border-radius:9px;box-shadow:inset 0 -7px 10px rgba(0,0,0,.28)}
.row .nm{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.row .nm b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{color:var(--muted);text-transform:capitalize}
.row .st{font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px;white-space:nowrap}
.row .st img{width:18px;height:18px}
.row .st.g{color:#7dff9b}.row .st.c{color:var(--gold)}.row .st.m{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:18px 6px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--panel);color:var(--ink);padding:12px 20px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:5;backdrop-filter:blur(3px)}
#toast.on{opacity:1;transform:translate(-50%,0)}

.modes{display:flex;gap:8px;width:100%;max-width:1100px}
.mtab{flex:1;padding:12px 8px;border-radius:12px;background:var(--panel);color:var(--muted);font-weight:700;font-size:17px}
.mtab.on{background:var(--accent);color:#1a1210}
.wh{margin:2px 0 8px;font-size:17px;display:flex;justify-content:space-between;align-items:baseline}.wh small{color:var(--muted);font-weight:400;font-size:13px}
#boxes{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.bx{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.28);color:var(--ink);border:2px solid var(--bc)}
.bx:hover:not(:disabled){background:rgba(0,0,0,.45)}.bx:disabled{opacity:.55;cursor:default}
.bx .ic{flex:0 0 52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#1a1210;background:linear-gradient(135deg,var(--bc),#fff8);box-shadow:inset 0 -8px 12px rgba(0,0,0,.25)}
.bx .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.bx .nm b{font-size:16px}.bx .nm small{color:var(--muted);font-size:11px;line-height:1.3}
.bx .pr{display:flex;align-items:center;gap:4px;color:var(--gold);font-weight:700;white-space:nowrap}.bx .pr img{width:20px;height:20px}
#wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.wt{display:flex;flex-direction:column;gap:5px;padding:6px;border-radius:12px;background:rgba(0,0,0,.28);color:var(--ink);border:2px solid transparent;text-align:left}
.wt:hover{background:rgba(0,0,0,.45)}.wt.on{border-color:var(--accent);background:rgba(255,138,76,.14)}
.wt .sp{height:46px;border-radius:8px;box-shadow:inset 0 -9px 12px rgba(0,0,0,.28);position:relative}
.wt b{font-size:12px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wt small{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.wt.no{opacity:.4}.wt.no .sp::after{content:"?";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;text-shadow:0 2px 6px #000}
.wname{display:flex;align-items:center;gap:10px;font-size:18px;flex-wrap:wrap}.wname .sp{width:34px;height:34px;border-radius:9px;box-shadow:inset 0 -7px 10px rgba(0,0,0,.28)}
#ov{position:fixed;inset:0;z-index:10;background:rgba(10,8,14,.82);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px}
#ov.on{display:flex}
.ovc{width:min(640px,100%);display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.reel{position:relative;width:100%;height:132px;overflow:hidden;border-radius:16px;background:rgba(0,0,0,.45)}
.reel .mark{position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:#fff;z-index:2;box-shadow:0 0 12px #fff}
.reel .track{position:absolute;left:0;top:10px;display:flex;gap:6px;will-change:transform}
.reel .it{flex:0 0 110px;height:112px;border-radius:12px;display:flex;align-items:flex-end;justify-content:center;padding:6px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 4px #000,0 0 6px #000;border-bottom:6px solid var(--rc)}
#res{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:150px}
#res .big{width:190px;height:110px;border-radius:16px;box-shadow:inset 0 -18px 24px rgba(0,0,0,.3),0 0 40px var(--rc);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
#res h3{margin:0;font-size:28px;color:var(--rc)}
#ovbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
@media (max-width:700px){
 .garage{grid-template-columns:1fr}
 .list{max-height:none;overflow:visible}
 .tabs{position:static}
 #rows{flex-direction:row;overflow-x:auto;padding-bottom:6px}
 .row{flex:0 0 168px}
 .hint{display:none}
}
</style>
</head>
<body>
<iframe id="bgmap" src="game.html?bg=1" tabindex="-1" aria-hidden="true"></iframe><div id="bgdim"></div>
<div class="top"><button class="btn ghost" id="back">&larr; Menu</button><h2>Garage</h2><div class="coins" id="coins"></div></div>
<div class="modes" id="modes"><button class="mtab on" data-m="cars">Cars</button><button class="mtab" data-m="wraps">Wraps &amp; Boxes</button></div>
<div class="garage">
 <section class="panel stage">
  <div class="viewer" id="viewer">
   <canvas id="cv"></canvas>
   <div class="tags" id="tags"></div>
   <button class="nav prev" id="prev" aria-label="Previous car">&lsaquo;</button>
   <button class="nav next" id="next" aria-label="Next car">&rsaquo;</button>
   <div class="hint">Drag to rotate</div>
  </div>
  <div class="info">
   <h3 id="cname"></h3>
   <div class="stats" id="stats"></div>
   <div class="buy" id="buy"></div>
  </div>
 </section>
 <aside class="panel list" id="clist">
  <div class="tabs" id="tabs"><button class="tab on" data-f="all">All</button><button class="tab" data-f="owned">Owned</button><button class="tab" data-f="locked">Locked</button></div>
  <div id="rows"></div>
 </aside>
 <aside class="panel list" id="wlist" style="display:none">
  <div class="wh">Mystery boxes <small>duplicates give coins back</small></div>
  <div id="boxes"></div>
  <div class="wh">Wraps <small id="wcount"></small></div>
  <div id="wgrid"></div>
 </aside>
</div>
<div id="ov"><div class="ovc"><h2 id="ovt"></h2><div class="reel"><div class="mark"></div><div class="track" id="track"></div></div><div id="res"></div><div id="ovbtns" style="display:none"><button class="btn" id="ovequip">Equip</button><button class="btn ghost" id="ovclose">Continue</button></div></div></div>
<div id="toast"></div>
<script src="three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>')</script>
<script src="config.js"></script>
<script src="device.js"></script>
<script src="cars.js"></script>
<script src="carmodel.js"></script>
<script>
const $=id=>document.getElementById(id);
const STATS=[['Top speed','top'],['Acceleration','acc'],['Steering','steer'],['Grip','grip'],['Durability','dur']];
const RNG=Object.fromEntries(STATS.map(([,k])=>[k,[Math.min(...RANKS.map(r=>r[k])),Math.max(...RANKS.map(r=>r[k]))]]));
let sel=prog.car,filter='all',mode='cars',pvw,busy=false; // pvw: wrap being previewed on the car (undefined = the equipped one, '' = factory paint)

// ---------- 3D viewer ----------
let renderer,scene,camera,carGroup,cur=null,yaw=.65,drag=null,pop=1,gl=true,last=performance.now();
try{
 if(typeof THREE==='undefined')throw 0;
 renderer=new THREE.WebGLRenderer({canvas:$('cv'),antialias:true,alpha:true});
 renderer.setClearColor(0,0);renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
 scene=new THREE.Scene();
 camera=new THREE.PerspectiveCamera(32,1,.1,100);camera.position.set(0,3.3,11.2);camera.lookAt(0,.85,0);
 scene.add(new THREE.HemisphereLight(0xfff0d8,0x4a3a50,.95));
 const sun=new THREE.DirectionalLight(0xffe6c0,.9);sun.position.set(5,8,6);scene.add(sun);
 const rim=new THREE.DirectionalLight(0xff8a4c,.55);rim.position.set(-6,3,-5);scene.add(rim);
 const plat=new THREE.Mesh(new THREE.CylinderGeometry(3.7,3.9,.25,28),new THREE.MeshPhongMaterial({color:0x2c2431,flatShading:true,shininess:0}));plat.position.y=-.13;scene.add(plat);
 const ring=new THREE.Mesh(new THREE.RingGeometry(3.25,3.45,40),new THREE.MeshBasicMaterial({color:0xff8a4c,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.01;scene.add(ring);
 const blob=new THREE.Mesh(new THREE.CircleGeometry(2.7,28),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.35,depthWrite:false}));blob.rotation.x=-Math.PI/2;blob.position.y=.02;scene.add(blob);
 carGroup=new THREE.Group();scene.add(carGroup);
 function fit(){const v=$('viewer'),w=v.clientWidth,h=v.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;
  // keep the whole car in view on narrow stages
  camera.position.set(0,3.3,11.2*Math.max(1,1.3/camera.aspect));camera.lookAt(0,.85,0);camera.updateProjectionMatrix()}
 if(window.ResizeObserver)new ResizeObserver(fit).observe($('viewer'));addEventListener('resize',fit);fit();
}catch(e){gl=false;$('viewer').classList.add('nogl')}

function showCar(i){
 if(!gl)return;
 if(cur){carGroup.remove(cur.root);cur.root.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)[].concat(o.material).forEach(m=>m.dispose())})}
 cur=buildCar(i,carGroup,pvw!==undefined?pvw:prog.weq[i]);pop=0;
}
function frame(now){
 requestAnimationFrame(frame);
 if(!gl||document.hidden)return;
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(!drag)yaw+=dt*.5;
 carGroup.rotation.y=yaw;
 if(pop<1){pop=Math.min(1,pop+dt*3.5);const e=1-Math.pow(1-pop,3),s=.82+.18*e;carGroup.scale.set(s,s,s)}
 if(cur)cur.wheels.forEach(w=>{w.spin.rotation.x+=dt*2.5});
 flameTick();
 renderer.render(scene,camera);
}
const vw=$('viewer');
vw.addEventListener('pointerdown',e=>{if(e.target.closest('.nav'))return;drag={x:e.clientX,y0:yaw};try{vw.setPointerCapture(e.pointerId)}catch(_){}});
vw.addEventListener('pointermove',e=>{if(drag)yaw=drag.y0+(e.clientX-drag.x)*.011});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>vw.addEventListener(ev,()=>{drag=null}));

// ---------- garage UI ----------
const status=i=>prog.car===i?'eq':prog.owned.includes(i)?'own':'lock';
const order=()=>RANKS.map((_,i)=>i).sort((a,b)=>PRICES[a]-PRICES[b]||a-b).filter(i=>mode==='wraps'?prog.owned.includes(i):(filter==='all'||(filter==='owned'?prog.owned.includes(i):!prog.owned.includes(i))));
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
function select(i,noScroll){
 sel=i;pvw=undefined;showCar(i);draw(noScroll);
}
function step(d){const o=order();if(!o.length)return;let k=o.indexOf(sel);k=k<0?0:(k+d+o.length)%o.length;select(o[k])}
function draw(noScroll){
 const R=RANKS[sel],st=status(sel),price=PRICES[sel],ew=prog.weq[sel];
 $('coins').innerHTML=coinImg+'<b>'+prog.coins+'</b>';
 $('cname').textContent=R.v;
 $('tags').innerHTML=`<span class="chip">${R.cat||R.k}</span>`+(mode==='wraps'?(ew?`<span class="chip" style="background:${RAR[WRAP_BY[ew].r].c};color:#111">${WRAP_BY[ew].n}</span>`:''):(st==='eq'?'<span class="chip eq">Equipped</span>':st==='own'?'<span class="chip ok">Owned</span>':'<span class="chip lock">Locked</span>'));
 $('stats').innerHTML=STATS.map(([n,k])=>{const [a,b]=RNG[k],p=Math.round(12+88*(R[k]-a)/((b-a)||1));return `<span class="l">${n}</span><div class="bar"><i style="width:${p}%"></i></div><span class="v">${Math.round(R[k]*100)}</span>`}).join('');
 if(mode==='wraps')return drawWraps();
 if(st==='eq')$('buy').innerHTML='<button class="btn ok" disabled>Equipped &#10003;</button>';
 else if(st==='own')$('buy').innerHTML='<button class="btn" id="act">Equip</button>';
 else{const can=prog.coins>=price;$('buy').innerHTML=`<div class="price">${coinImg}${price}</div><button class="btn" id="act" ${can?'':'disabled'}>${can?'Buy':'Need '+(price-prog.coins)+' more'}</button>`}
 const o=order();
 $('rows').innerHTML=o.length?o.map(i=>{const s=status(i);
  return `<button class="row${i===sel?' on':''}" data-i="${i}"><span class="sw" style="background:#${hex(RANKS[i].c)}"></span><span class="nm"><b>${RANKS[i].v}</b><small>${RANKS[i].cat||RANKS[i].k}</small></span>`+
  (s==='eq'?'<span class="st g">&#10003; Equipped</span>':s==='own'?'<span class="st m">Owned</span>':`<span class="st c">${coinImg}${PRICES[i]}</span>`)+`</button>`}).join(''):'<div class="empty">Nothing here yet</div>';
 document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.f===filter));
 if(!noScroll){const r=document.querySelector('.row.on');if(r&&r.scrollIntoView)r.scrollIntoView({block:'nearest',inline:'nearest'})}
}
// ---------- wraps & boxes ----------
const sp=w=>`background:${wrapCSS(w)}`;
function drawWraps(){
 const ew=prog.weq[sel]||'',shown=pvw!==undefined?pvw:ew,W0=shown?WRAP_BY[shown]:null;
 $('buy').innerHTML=`<div class="wname">${W0?`<span class="sp" style="${sp(W0)}"></span><b>${W0.n}</b><span class="chip" style="background:${RAR[W0.r].c};color:#111">${RAR[W0.r].n}</span>`:'<b>Factory paint</b>'}</div>`+
  (shown!==ew?'<button class="btn" id="act">Equip wrap</button>':shown?'<button class="btn ghost" id="act">Remove wrap</button>':'<button class="btn" disabled>Pick a wrap &rarr;</button>');
 $('boxes').innerHTML=BOXES.map(b=>{const can=prog.coins>=b.price;
  return `<button class="bx" data-b="${b.id}" style="--bc:${b.ui}" ${can&&!busy?'':'disabled'}><span class="ic">?</span><span class="nm"><b>${b.n}</b><small>${RAR_ORDER.filter(k=>b.odds[k]>0).map(k=>`<span style="color:${RAR[k].c}">${RAR[k].n} ${+(b.odds[k]*100).toFixed(1)}%</span>`).join(' &middot; ')}</small></span><span class="pr">${can?coinImg+b.price:'Need '+(b.price-prog.coins)}</span></button>`}).join('');
 const list=[''].concat(WRAPS.slice().sort((a,b)=>RAR_ORDER.indexOf(a.r)-RAR_ORDER.indexOf(b.r)).map(w=>w.id));
 $('wcount').textContent=prog.wraps.length+'/'+WRAPS.length+' collected';
 $('wgrid').innerHTML=list.map(id=>{
  if(!id)return `<button class="wt${shown===''?' on':''}" data-w=""><span class="sp" style="background:#${hex(RANKS[sel].c)}"></span><b>Factory</b><small style="color:var(--muted)">Default</small></button>`;
  const w=WRAP_BY[id],own=prog.wraps.includes(id);
  return `<button class="wt${own?'':' no'}${shown===id?' on':''}" data-w="${id}"><span class="sp" style="${sp(w)}"></span><b>${w.n}</b><small style="color:${RAR[w.r].c}">${RAR[w.r].n}</small></button>`}).join('');
}
function wrapAct(){
 const ew=prog.weq[sel]||'',shown=pvw!==undefined?pvw:ew;
 if(shown!==ew){if(shown)prog.weq[sel]=shown;else delete prog.weq[sel];toast(shown?'Equipped '+WRAP_BY[shown].n:'Wrap removed')}
 else if(shown){delete prog.weq[sel];pvw='';toast('Wrap removed');showCar(sel)}
 saveProg();pvw=undefined;draw(true)}
$('wgrid').onclick=e=>{const b=e.target.closest('.wt');if(!b||busy)return;const id=b.dataset.w;
 if(id&&!prog.wraps.includes(id)){toast('Not owned yet \u2014 open a box!');return}
 pvw=id;showCar(sel);draw(true)};
$('modes').onclick=e=>{const b=e.target.closest('.mtab');if(!b||busy)return;mode=b.dataset.m;
 document.querySelectorAll('.mtab').forEach(t=>t.classList.toggle('on',t===b));
 $('wlist').style.display=mode==='wraps'?'':'none';$('clist').style.display=mode==='wraps'?'none':'';
 if(mode==='wraps'&&!prog.owned.includes(sel))sel=prog.car;
 select(sel,true)};
// open a box: the reel scrolls and lands on the wrap that was rolled
$('boxes').onclick=e=>{const b=e.target.closest('.bx');if(!b||b.disabled||busy)return;openBox(BOXES.find(x=>x.id===b.dataset.b))};
function openBox(b){
 if(prog.coins<b.price)return;busy=true;prog.coins-=b.price;
 const win=rollBox(b),dupe=prog.wraps.includes(win.id);
 if(dupe)prog.coins+=DUPE[win.r];else prog.wraps.push(win.id);saveProg();
 const IDX=38,STEP=116,items=[];
 for(let i=0;i<46;i++)items.push(i===IDX?win:WRAPS[Math.floor(Math.random()*WRAPS.length)]);
 $('ovt').textContent=b.n;$('res').innerHTML='';$('ovbtns').style.display='none';
 const tr=$('track');tr.style.transition='none';tr.style.transform='translateX(0)';
 tr.innerHTML=items.map(w=>`<div class="it" style="${sp(w)};--rc:${RAR[w.r].c}">${w.n}</div>`).join('');
 $('ov').classList.add('on');draw(true);
 const cw=tr.parentNode.clientWidth,x=IDX*STEP+55+(Math.random()-.5)*60;
 void tr.offsetWidth;tr.style.transition='transform 4.4s cubic-bezier(.1,.75,.1,1)';tr.style.transform=`translateX(${-(x-cw/2)}px)`;
 let done=false;const fin=()=>{if(done)return;done=true;
  $('res').style.setProperty('--rc',RAR[win.r].c);
  $('res').innerHTML=`<div class="big" style="${sp(win)}"></div><h3>${win.n}</h3><b style="color:${RAR[win.r].c}">${RAR[win.r].n}</b>`+(dupe?`<span class="price">Duplicate &mdash; ${coinImg}+${DUPE[win.r]} coins</span>`:'<span style="color:#7dff9b;font-weight:700">NEW!</span>');
  $('ovequip').style.display=dupe&&prog.weq[sel]===win.id?'none':'';$('ovequip').textContent='Equip on '+RANKS[sel].v;
  $('ovbtns').style.display='flex';$('ovbtns').dataset.w=win.id;$('coins').innerHTML=coinImg+'<b>'+prog.coins+'</b>'};
 tr.addEventListener('transitionend',fin,{once:true});setTimeout(fin,4800)}
$('ovclose').onclick=()=>{$('ov').classList.remove('on');busy=false;pvw=$('ovbtns').dataset.w;showCar(sel);draw(true)};
$('ovequip').onclick=()=>{const id=$('ovbtns').dataset.w;prog.weq[sel]=id;saveProg();$('ov').classList.remove('on');busy=false;pvw=undefined;showCar(sel);draw(true);toast('Equipped '+WRAP_BY[id].n)};
function act(){
 if(mode==='wraps')return wrapAct();
 const i=sel,R=RANKS[i];
 if(prog.owned.includes(i)){prog.car=i;saveProg();toast('Equipped '+R.v)}
 else if(prog.coins>=PRICES[i]){prog.coins-=PRICES[i];prog.owned.push(i);prog.car=i;saveProg();toast('Bought '+R.v+'!');vw.classList.remove('bought');void vw.offsetWidth;vw.classList.add('bought')}
 draw(true)}
$('buy').onclick=e=>{if(e.target.closest('#act'))act()};
$('rows').onclick=e=>{const b=e.target.closest('.row');if(b)select(+b.dataset.i,true)};
$('tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;filter=b.dataset.f;const o=order();if(o.length&&!o.includes(sel))select(o[0],true);else draw(true)};
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);else if(e.key==='Enter'){const a=$('act');if(a&&!a.disabled)act()}});
$('back').onclick=()=>go('index.html');
select(sel);
requestAnimationFrame(frame);
</script>
</body>
