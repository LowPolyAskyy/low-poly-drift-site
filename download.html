<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Download - Low Poly Drift</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a1216">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Low Poly Drift">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="ui.css">
<style>
body{justify-content:flex-start}
.wrap{width:100%;max-width:980px;display:flex;flex-direction:column;gap:16px}
.intro{text-align:center;color:var(--ink);font-size:17px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:24px 18px;border:2px solid transparent}
.card.me{border-color:var(--accent);box-shadow:0 0 28px rgba(255,138,76,.35)}
.card .ic{line-height:0;color:var(--ink)}
.card h3{margin:0;font-size:24px}
.card small{color:var(--muted);font-size:13px;line-height:1.4;min-height:36px}
.tag{position:absolute;top:10px;right:12px;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;background:var(--accent);color:#1a1210;border-radius:99px;padding:4px 10px;display:none}
.card.me .tag{display:block}
a.btn{display:inline-block;text-decoration:none;text-align:center;width:100%}
a.btn.off{background:rgba(255,255,255,.12);color:var(--muted);pointer-events:none}
.steps{font-size:14px;line-height:1.6;color:var(--muted)}
.steps b{color:var(--ink)}
.how{margin:0;padding-left:20px;text-align:left;font-size:13px;line-height:1.55;color:var(--muted);width:100%}.how b{color:var(--ink)}
.steps ol{margin:6px 0 0;padding-left:22px}
</style>
</head>
<body>
<iframe id="bgmap" data-src="game.html?bg=1&low=1" tabindex="-1" aria-hidden="true"></iframe><div id="bgdim"></div>
<div class="top"><button class="btn ghost" id="back">&larr; Menu</button><h2>Download</h2><span></span></div>
<div class="wrap">
 <p class="intro">Play Low Poly Drift as an app. Same game, same account progress on each device.</p>
 <div class="cards" id="cards"></div>
 <div class="panel steps" id="help"></div>
</div>
<script src="config.js"></script>
<script src="device.js"></script>
<script src="cars.js"></script>
<script>
// The Download page is for the website only: inside the apps it sends you back to the menu.
if(window.IN_APP)location.replace('index.html');

// ---- Where the files are: edit downloads.json (a few lines), not this page. Every "url" can be a file inside /downloads of this site
// or a full link to another site (GitHub Releases, Dropbox...), so the heavy APK / EXE do not have to be uploaded with the site each time.
// An empty url or a file that cannot be found shows "Coming soon". To change links without redeploying the site at all,
// host downloads.json elsewhere (needs CORS, e.g. raw.githubusercontent.com) and set window.DOWNLOADS_JSON in config.js.
const FILES={
  android:{url:'downloads/LowPolyDrift.apk',label:'Download APK',size:''},
  windows:{url:'downloads/LowPolyDrift.exe',label:'Download for Windows',size:''},
  ios:{url:'',label:'Get for iPhone',size:''}
};
// logos for Android, Apple and Windows
const LOGO=(d,s)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="${s}" height="${s}" fill="currentColor" aria-hidden="true"><path d="${d}"/></svg>`;
const LOGOS={
 android:LOGO('M18.4395 5.5586c-.675 1.1664-1.352 2.3318-2.0274 3.498-.0366-.0155-.0742-.0286-.1113-.043-1.8249-.6957-3.484-.8-4.42-.787-1.8551.0185-3.3544.4643-4.2597.8203-.084-.1494-1.7526-3.021-2.0215-3.4864a1.1451 1.1451 0 0 0-.1406-.1914c-.3312-.364-.9054-.4859-1.379-.203-.475.282-.7136.9361-.3886 1.5019 1.9466 3.3696-.0966-.2158 1.9473 3.3593.0172.031-.4946.2642-1.3926 1.0177C2.8987 12.176.452 14.772 0 18.9902h24c-.119-1.1108-.3686-2.099-.7461-3.0683-.7438-1.9118-1.8435-3.2928-2.7402-4.1836a12.1048 12.1048 0 0 0-2.1309-1.6875c.6594-1.122 1.312-2.2559 1.9649-3.3848.2077-.3615.1886-.7956-.0079-1.1191a1.1001 1.1001 0 0 0-.8515-.5332c-.5225-.0536-.9392.3128-1.0488.5449zm-.0391 8.461c.3944.5926.324 1.3306-.1563 1.6503-.4799.3197-1.188.0985-1.582-.4941-.3944-.5927-.324-1.3307.1563-1.6504.4727-.315 1.1812-.1086 1.582.4941zM7.207 13.5273c.4803.3197.5506 1.0577.1563 1.6504-.394.5926-1.1038.8138-1.584.4941-.48-.3197-.5503-1.0577-.1563-1.6504.4008-.6021 1.1087-.8106 1.584-.4941z',58),
 ios:LOGO('M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701',58),
 windows:LOGO('M0 3.45 9.8 2.1v9.45H0zM10.9 1.95 24 0v11.55H10.9zM0 12.45h9.8v9.45L0 20.55zM10.9 12.45H24V24l-13.1-1.85z',58)
};
const PLAT=[
 {k:'android',n:'Android',d:'Phones and tablets with Android 8 or newer. Installs from the APK file.'},
 {k:'ios',n:'iPhone',d:'iPhone and iPad. Free, installs from Safari.'},
 {k:'windows',n:'Computer (Windows)',d:'Windows 10 / 11, 64-bit. Single file, no installation needed.'}
];
const ua=navigator.userAgent,mine=/android/i.test(ua)?'android':/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)?'ios':/windows/i.test(ua)?'windows':'';
// downloads.json is read forgivingly: {"url":"..."} is the normal form, but a link written as the key ("https://...": "...") works too,
// and a GitHub release PAGE link (.../releases/tag/v1.0/File.apk) is turned into the real file link (.../releases/download/v1.0/File.apk)
const fixGH=u=>String(u).replace(/(github\.com\/[^/]+\/[^/]+\/releases)\/tag\/([^/]+)\/(.+)$/,'$1/download/$2/$3');
function norm(o){if(!o||typeof o!=='object')return {};const r={};let u=o.url;
 if(typeof u!=='string')for(const k in o)if(/^https?:\/\//i.test(k)){u=k;break}
 if(typeof u!=='string')for(const k in o)if(typeof o[k]==='string'&&/^https?:\/\//i.test(o[k])){u=o[k];break}
 if(typeof u==='string')r.url=fixGH(u.trim());
 if(o.size)r.size=String(o.size);if(o.label)r.label=String(o.label);return r}
const sameSite=u=>{try{return new URL(u,location.href).origin===location.origin}catch(e){return false}};
// a file of this site that is not uploaded shows "Coming soon" instead of a broken link (other sites cannot be checked from the browser, they are trusted)
async function exists(f){if(!f.url)return false;if(!sameSite(f.url))return true;
  try{const r=await fetch(f.url,{method:'HEAD',cache:'no-store'});return r.ok&&!/text\/html/.test(r.headers.get('content-type')||'')}catch(e){return location.protocol==='file:'}}
function render(){
 document.getElementById('cards').innerHTML=PLAT.map(p=>{const f=FILES[p.k],ok=f.ok&&!!f.url,ext=!sameSite(f.url||'');
  return `<div class="panel card${mine===p.k?' me':''}"><span class="tag">Your device</span><div class="ic">${LOGOS[p.k]}</div><h3>${p.n}</h3><small>${p.d}${ok&&f.size?' ('+f.size+')':''}</small>`+
  (ok?`<a class="btn" href="${f.url}" ${p.k==='ios'?'target="_blank"':(ext?'':'download')} rel="noopener">${f.label}</a>`:
   p.k==='ios'?`<ol class="how"><li>Open this page in <b>Safari</b></li><li>Tap the <b>Share</b> button (square with an arrow)</li><li>Choose <b>Add to Home Screen</b></li></ol><a class="btn" id="cp" href="#">Copy site link</a>`:
   '<a class="btn off">Coming soon</a>')+`</div>`}).join('');
 const cp=document.getElementById('cp');if(cp)cp.onclick=e=>{e.preventDefault();const u=location.origin+'/';(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>cp.textContent='Link copied!').catch(()=>{cp.textContent=u})};
 document.getElementById('help').innerHTML=
  '<b>Android:</b> download the APK, open it, and allow "Install unknown apps" for your browser if Android asks. Needs Android 8 or newer. If it says <b>"App not installed"</b>: uninstall any older copy of Low Poly Drift first, free some storage, and try again.'+
  '<br><b>Windows:</b> run <b>LowPolyDrift.exe</b>. If Windows shows "Windows protected your PC", click <b>More info</b> &rarr; <b>Run anyway</b> (the file is not code-signed).'+
  '<br><b>iPhone:</b> '+(FILES.ios.ok&&FILES.ios.url?'open the link and follow the steps.':'open the game in Safari, tap Share, then Add to Home Screen. It opens full screen like an app. (Other browsers on iPhone may not offer this.)')}
(async()=>{
 render();   // shows "Coming soon" until we know what is available
 try{const r=await fetch(window.DOWNLOADS_JSON||'downloads.json',{cache:'no-store'});
  if(r.ok){const j=await r.json();for(const k in FILES)Object.assign(FILES[k],norm(j[k]))}}catch(e){}
 for(const k in FILES)FILES[k].ok=await exists(FILES[k]);
 render()})();
const av=(ua.match(/Android (\d+)/)||[])[1];
if(av&&+av<8)document.getElementById('help').insertAdjacentHTML('beforebegin','<div class="panel" style="color:#ffb0a0;font-weight:700">Your Android ('+av+') is too old for the app (needs 8+). Play in the browser instead.</div>');
document.getElementById('back').onclick=()=>go('index.html');
</script>
</body>
</html>
