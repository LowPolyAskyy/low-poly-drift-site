 net.players={};net.host=false;net.fin={};netUI();$('pl').style.display='none';nmsg(msg||(lost?'Disconnected from server':''));
 if(ONLINE&&!net.kicked)showEndMsg(lost?'Disconnected':'Cannot join',msg||'Disconnected from server');
}
let kickT=0;
function kickedScreen(reason){
 const why=reason==='admin'?'An admin removed you from the room.':'You stood still for more than a minute, so you were removed from the room.';let left=15;
 for(const k in keys)keys[k]=0;for(const k in touch)touch[k]=0;touch.sx=0;
 $('vote').style.display='none';$('toast').style.opacity=0;
 const draw=()=>{$('end').innerHTML=`<div class="card"><h2>Kicked</h2><p>${esc(why)}</p><p>You can no longer move. Returning to the lobby in <b id="kc">${left}</b>s</p><br><button id="leave">Back to lobby</button></div>`;$('end').style.display='flex'};
 draw();clearInterval(kickT);
 kickT=setInterval(()=>{left--;if(left<=0){clearInterval(kickT);leaveRoom();return}const e=$('kc');if(e)e.textContent=left},1000);
}
function showEndMsg(title,text){
 $('end').innerHTML=`<div class="card"><h2>${esc(title)}</h2><p>${esc(text)}</p><br><button id="leave">Back to lobby</button></div>`;$('end').style.display='flex';
}
function leaveRoom(){if(window.VC)VC.leave();const ws=net.ws;net.ws=null;if(ws)try{ws.close()}catch(e){}go(ONLINE?'lobby.html':'index.html')}
function showStandings(list){
 const me=net.id,mine=list.find(r=>r.id===me);net.noRew=!(mine&&mine.time!=null);
 if(!lastRes&&mine&&mine.racer&&mine.time==null&&list.some(r=>r.racer&&r.time!=null)){const tot=list.filter(r=>r.racer).length;if(tot>=2)applyDnf(tot)}
 $('end').innerHTML=`<div class="card"><h2>Race results</h2><table>${list.map((r,i)=>`<tr><td>${i+1}. ${esc(r.name)}${r.id===me?' (you)':''}<td>${r.time!=null?fmt(r.time):'DNF'}`).join('')}</table><div id="rankend"></div><button id="park">${ARENA?'Close':'Back to the park'}</button><button id="leave">Leave room</button></div>`;
 $('end').style.display='flex';renderRankEnd();
}
// ---- vote: 3 random maps, the most voted one is raced ----
function hideVote(){net.voteEnd=0;$('vote').style.display='none'}
function voteCounts(v){document.querySelectorAll('#vote .vn').forEach((e,i)=>e.textContent=(v&&v[i])||0)}
function showVote(maps,left,votes){
 net.maps=maps;net.myVote=-1;net.voteEnd=performance.now()+left;$('end').style.display='none';
 $('vote').innerHTML=`<h1>Pick the track</h1><p id="vsec"></p><div class="vs">${maps.map((mi,i)=>!MAPS[mi]?'':`<button data-i="${i}" style="background:linear-gradient(#${hex(MAPS[mi].t)},#${hex(MAPS[mi].f)})${MAPS[mi].x?';box-shadow:0 0 0 3px #c8102e':''}"><span class="vn">0</span><b>${MAPS[mi].n}</b><small>${i+1} &middot; 3 laps</small></button>`).join('')}</div><p>Most votes wins &middot; a tie is decided by chance</p>`;
 $('vote').style.display='flex';voteCounts(votes);
}
function pickMap(i){if(!net.voteEnd||!net.maps||i<0||i>2)return;net.myVote=i;nsend({t:'pick',i});document.querySelectorAll('#vote button').forEach((b,k)=>b.classList.toggle('sel',k===i))}
$('vote').onclick=e=>{const b=e.target.closest('button');if(b)pickMap(+b.dataset.i)};
function netMsg(m){
 if(m.t==='welcome'){net.id=m.id;net.slot=m.slot;net.pub=!!m.pub;net.code=m.code;net.phase=m.phase||'wait';resetCarArena();S.ca=S.a;if(net.phase==='vote')showVote(m.maps,m.left,m.votes);roomBar()}
 else if(m.t==='error'){netLeave(false,m.msg)}
 else if(m.t==='players'){
  net.players=m.players;net.hostId=m.host;net.host=m.host===net.id;
  for(const id in remote)if(!m.players[id]){scene.remove(remote[id].car.root);delete remote[id]}
  for(const id in m.players){if(id===net.id)continue;const pl=m.players[id],ty=pl.car|0,old=remote[id];
   const wr=pl.wrap||'';if(old&&old.type===ty&&old.wrap===wr&&old.dev===pl.dev)continue;
   if(old)scene.remove(old.car.root);
   const car=makeCar(ty,wr);car.root.add(nameSprite(pl.name,pl.dev));car.root.visible=false;
   remote[id]=Object.assign(old||{x:0,y:0,z:0,a:0,st:0,vf:0,p:0,l:1,init:false},{car,type:ty,wrap:wr,dev:pl.dev});
   if(old)car.root.position.copy(old.car.root.position)}
  netUI()}
 else if(m.t==='vote'){net.phase='vote';showVote(m.maps,m.left,m.votes);roomBar()}
 else if(m.t==='votes')voteCounts(m.votes)
 else if(m.t==='start'){net.phase='race';net.fin={};net.noRew=false;hideVote();for(const id in remote)remote[id].init=false;if(m.seed)seed=m.seed;startRace(m.map);roomBar()}
 else if(m.t==='over'){net.phase='wait';roomBar();hideVote();showStandings(m.results||[])}
 else if(m.t==='afk')toast('Move! Kicked in '+m.left+'s',0xff5a4a)
 else if(m.t==='kicked'){net.kicked=true;kickedScreen(m.reason)}
 else if(m.t==='toast'){toast(String(m.text||'').slice(0,60),0xffd24a)}
 else if(m.t==='gift'){if(m.coins){prog.coins=Math.max(0,prog.coins+(m.coins|0))}if(m.unlock)prog.owned=RANKS.map((_,i)=>i);saveProg();coinBar();toast('Admin: '+(m.coins?(m.coins>0?'+':'')+m.coins+' coins':'all cars unlocked'),0xffd24a)}
 else if(m.t==='power'){const w=PW.find(q=>q.k===m.k);if(w&&mode!=='menu'){if(w.t)act[w.k]=(act[w.k]||0)+w.t;else w.f();toast('Admin: '+w.n,w.c)}}
 else if(m.t==='s'){const r=remote[m.id];if(r){if(r.w!==m.w)r.init=false;Object.assign(r,{w:m.w,x:m.x,y:m.y,z:m.z,a:m.a,st:m.st,vf:m.vf,pt:m.pt,rl:m.rl,sc:m.sc,p:m.p,l:m.l});if(!r.init){const o=r.car.root;o.position.set(m.x,m.y,m.z);o.rotation.y=m.a;r.init=true}}}
 else if(m.t==='fin'){net.fin[m.id]=m.time}
 else if(m.t==='result'){applyResult(m.pos,m.total)}
}
function plUI(){
 const W=ARENA?0:1;
 if(ARENA){ // park: names + trick/drift score
  const rows=[{n:(net.players[net.id]||{}).name||'You',s:Math.round(total),me:1}];
  for(const id in remote){const r=remote[id],p=net.players[id];if(r.w===0)rows.push({n:p?p.name:'?',s:r.sc||0})}
  rows.sort((a,b)=>b.s-a.s);
  let top=rows.slice(0,5);if(!top.includes(rows.find(r=>r.me)))top[4]=rows.find(r=>r.me);
  $('pl').style.display='block';
  $('pl').innerHTML=top.map(r=>`${rows.indexOf(r)+1}. ${r.me?'<b>':''}${esc(r.n)}${r.me?'</b>':''} ${r.s}`).join('<br>');return}
 const me=net.players[net.id],rows=[{n:me?me.name:'You',p:(lap-1)*N+S.ni,l:lap,f:net.fin[net.id]}];
 for(const id in remote){const r=remote[id],p=net.players[id];if(r.w===W)rows.push({n:p?p.name:'?',p:r.p,l:r.l,f:net.fin[id]})}
 rows.sort((a,b)=>(a.f!=null&&b.f!=null)?a.f-b.f:a.f!=null?-1:b.f!=null?1:b.p-a.p);
 $('pl').style.display='block';
 $('pl').innerHTML=rows.map((r,i)=>`${i+1}. ${esc(r.n)} ${r.f!=null?fmt(r.f):'L'+Math.min(r.l,LAPS)}`).join('<br>');
}
function netTick(dt){
 for(const id in remote){const r=remote[id],o=r.car.root,k=Math.min(1,dt*12);
  o.visible=mode!=='menu'&&r.init&&r.w===(ARENA?0:1);
  o.position.x+=(r.x-o.position.x)*k;o.position.y+=(r.y-o.position.y)*k;o.position.z+=(r.z-o.position.z)*k;o.rotation.y-=angDiff(o.rotation.y,r.a)*k;
  const pv=r.car.piv.rotation;pv.x-=angDiff(pv.x,r.pt||0)*k;pv.z-=angDiff(pv.z,r.rl||0)*k;
  r.car.wheels.forEach(w=>{w.spin.rotation.x+=r.vf*dt*2.2;if(w.front)w.pivot.rotation.y=r.st*.5})}
 if(!netOn())return;
 net.acc+=dt;
 if(net.acc>=.05&&mode!=='menu'){net.acc=0;nsend({t:'s',x:+S.x.toFixed(2),y:+(S.y+S.dip).toFixed(2),z:+S.z.toFixed(2),a:+S.a.toFixed(3),st:+S.st.toFixed(2),vf:+S.vf.toFixed(1),pt:+(S.pv+S.flip).toFixed(2),rl:+(S.rv+S.rol).toFixed(2),sc:Math.round(total),w:ARENA?0:1,l:lap,p:ARENA?0:(lap-1)*N+S.ni})}
 net.ui+=dt;if(net.ui>.25){net.ui=0;plUI()}
}
$('nleave').onclick=leaveRoom;$('rleave').onclick=leaveRoom;$('rstart').onclick=()=>{if(net.host)nsend({t:'start'})};$('rres').onclick=()=>{if(ARENA)resetCarArena();else if(mode==='race')resetCar()};
netUI();

const clock=new THREE.Clock(),dEl=$('drift'),cdEl=$('cd');
function loop(){
  requestAnimationFrame(loop);
  let dt=Math.min(clock.getDelta(),.05);
  const gp=DEV.poll(touch);if(gp.reset){if(mode==='race')resetCar();else if(mode==='arena')resetCarArena()}if(gp.menu&&!ONLINE&&mode==='race')showMenu();
  const sp=step(dt);netTick(dt);flameTick();AURU.value=performance.now()/1000;
  if(mode==='menu'){const a=performance.now()/4000,R=document.body.classList.contains('bg')?10:16;cam.position.set(S.x+Math.sin(a)*R,5.5+(S.cy-GY)+GY*.5,S.z+Math.cos(a)*R);cam.lookAt(S.x,1.5+S.y,S.z)}
  skyG.position.copy(cam.position);
  if(cd>-.6){cd-=dt;cdEl.textContent=cd>.4?Math.ceil(cd-.4):'GO!';cdEl.style.opacity=1;if(cd<=.4&&mode==='count')mode=ARENA?'arena':'race'}else cdEl.style.opacity=0;
  $('spd').textContent=Math.round(sp*(SET.units==='mph'?2.23694:3.6));
  if(net.voteEnd){const e=$('vsec');if(e)e.textContent=Math.max(0,Math.ceil((net.voteEnd-performance.now())/1000))+'s'}
  $('lap').textContent=lap;$('lt').textContent=fmt(raceT-lapStart);$('sc').textContent=Math.round(total);if(ARENA)arenaHud();
  if(chain>15){dEl.textContent='Drift '+Math.round(chain);dEl.style.opacity=1}
  else if(flash>0){flash-=dt;dEl.textContent=msg;dEl.style.opacity=1}
  else dEl.style.opacity=0;
  pickups.forEach(p=>{if(!p.on&&p.respawn>0){p.respawn-=dt;if(p.respawn<=0)movePickup(p)}if(p.on){
    p.m.rotation.y+=dt*2;
    p.m.position.y=p.y0+1.8+Math.sin(performance.now()/300+p.phase)*.3;
    p.hue=(p.hue+dt*.22)%1;
    const col=new THREE.Color().setHSL(p.hue,.95,.58);
    p.om.color.copy(col);p.om.emissive.copy(col);p.rm.color.copy(col);
  }});
  const ph=PW.filter(w=>A(w.k)).map(w=>`<span style="background:#${hex(w.c)}">${w.n} ${Math.ceil(act[w.k])}</span>`).join('');if(ph!==pwH){pwH=ph;$('pw').innerHTML=ph}
  drawMap();renderer.render(scene,cam);
}
function setCar(i){carIdx=i;CT=RANKS[i];
 scene.remove(root);const c=makeCar(i);root=c.root;tilt=c.tilt;piv=c.piv;wheels=c.wheels;bodyM=c.bodyM;hp=100;dmgLook();
 root.add(hl);root.position.set(S.x,S.y+S.dip,S.z);root.rotation.y=S.a;if(netOn())nsend({t:'car',car:i,wrap:prog.weq[i]||''})}
const ord=n=>n+((n%100>=11&&n%100<=13)?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th'));
function coinBar(){const rb=$('rankbar');if(rb)rb.innerHTML=rankBarHTML(prog.elo);$('coinbar').innerHTML=`${coinImg}<b>${prog.coins}</b><span>coins</span><span style="color:var(--muted)">&middot; ${RANKS[carIdx].v}</span>`}
// race reward: coins + Elo. Online with 2+ racers pays by finishing position (Elo: 1st +30, 2nd +15, 3rd 0, then down to -30 for last, see eloDelta); solo / alone pays a small flat amount of coins and no Elo.
function addElo(d){const o=prog.elo;prog.elo=Math.max(0,Math.min(ELO_MAX,o+d));return{oldElo:o,newElo:prog.elo,eloD:prog.elo-o,oldT:tierIdx(o),newT:tierIdx(prog.elo)}}
function sendElo(){if(netOn())nsend({t:'elo',elo:prog.elo})}
function applyResult(pos,total){
 const coins=(total>=2?50+30*(total-pos)+(pos===1?60:0):40)+bonusCoins;bonusCoins=0;
 const e=total>=2?addElo(eloDelta(pos,total)):null;
 prog.coins+=coins;saveProg();lastRes=Object.assign({pos,total,coins},e);renderRankEnd();coinBar();if(e)sendElo()}
// did not finish a race that others finished: counts as last place (Elo only, no coins)
function applyDnf(total){
 const e=addElo(eloDelta(total,total));saveProg();lastRes=Object.assign({pos:total,total,coins:0,dnf:true},e);renderRankEnd();coinBar();sendElo()}
function renderRankEnd(){const e=$('rankend');if(!e)return;
 if(!lastRes){e.innerHTML=ONLINE&&net.noRew?'<small>Finish the race to earn coins and Elo</small>':netOn()?'<small>Waiting for your reward...</small>':'';return}
 const L=lastRes;let h='';
 if(L.coins)h+=`<div class="coinwin">${coinImg}<div><b>+${L.coins} coins</b><br><small>${L.total>=2?ord(L.pos)+' of '+L.total+' &middot; ':''}${prog.coins} total</small></div></div>`;
 else if(L.dnf)h+=`<p>Did not finish</p>`;
 if(L.eloD!==undefined){const T=TIERS[L.newT],up=L.newT>L.oldT,dn=L.newT<L.oldT;
  h+=`<div class="rk">${tierImg(L.newT)}<div><b style="font-size:24px;color:${T.c}">${T.n}</b><br><b style="font-size:20px;color:${L.eloD>0?'#7dff9b':L.eloD<0?'#ff8c7d':'inherit'}">${L.eloD>0?'+':''}${L.eloD} Elo</b><br><small>${prog.elo} Elo total</small></div></div>`;
  if(up)h+=`<div class="rup">Promoted to ${T.n}!</div>`;
  if(dn)h+=`<div class="rdn">Demoted to ${T.n}</div>`}
 e.innerHTML=h}
if(ONLINE)enterArena();else{load(0);showMenu()}
loop();window.__ready=true;
if(ONLINE)netConnect();
// ?bg=1: used by the other pages as an animated map background (no UI, maps change every few seconds)
// ?bg=1&low=1 pushes the picture down so the car sits in the lower part of the page (Download page: the cards cover the middle)
const BGLOW=/[?&]low=1/.test(location.search);
function bgView(){const side=!BGLOW&&innerWidth>innerHeight*1.25?-Math.round(innerWidth*.23):0;   // wide screens: the car sits to the right of the centred menu
 if(BGLOW||side)cam.setViewOffset(innerWidth,innerHeight,side,BGLOW?-Math.round(innerHeight*.3):0,innerWidth,innerHeight);else cam.clearViewOffset();cam.updateProjectionMatrix()}
if(/[?&]bg=1/.test(location.search)){document.body.classList.add('bg');renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);
 document.body.style.background='#1a1216';const cv=renderer.domElement;cv.style.transition='opacity .5s';
 let bi=cur|0;bgView();
 // a new map every 7 seconds (with my car and wrap), fading out and in so the change is not a jump
 setInterval(()=>{cv.style.opacity=0;setTimeout(()=>{do{bi=(bi+1)%MAPS.length}while(MAPS[bi].x&&!XMAS_ON());load(bi);bgView();cv.style.opacity=1},520)},7000)}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;bgView()});
</script>
